<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf0f8;
            padding: 30px 15px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #123b70;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #1769aa;
        }

        .gender-options {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
        }

        .gender-options label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .gender-options input {
            width: auto;
            margin: 0;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #123b70;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1769aa;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Student Registration</h1>

        <p class="subtitle">
            Please fill in your details correctly.
        </p>

        <form action="#" method="post">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
            placeholder="Enter your full name" required>

            <label for="matric">Matriculation Number</label>
            <input type="text" id="matric" name="matric"
            placeholder="Enter your matric number" required>

            <label for="department">Department</label>
            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option>Information and Communication Technology</option>
                <option>Computer Science</option>
                <option>Mathematics</option>
                <option>Statistics</option>
                <option>Physics</option>
            </select>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
            placeholder="Enter your email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
            placeholder="Enter your phone number" required>

            <label>Gender</label>

            <div class="gender-options">
                <label>
                    <input type="radio" name="gender"
                    value="Male" required> Male
                </label>

                <label>
                    <input type="radio" name="gender"
                    value="Female"> Female
                </label>
            </div>

            <label for="programme">Programme</label>
            <select id="programme" name="programme" required>
                <option value="">Select Programme</option>
                <option>Full-Time</option>
                <option>Part-Time</option>
                <option>Distance Learning</option>
            </select>

            <button type="submit">Submit Registration</button>

        </form>

        <p class="footer">
            Student Registration Portal
        </p>

    </div>

</body>
</html>
